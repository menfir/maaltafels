<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#4f46e5">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon.png">
<link rel="apple-touch-icon" href="./icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Maaltafels">
<meta name="mobile-web-app-capable" content="yes">
<title>Maaltafels oefenen</title>
<style>
:root{
  --bg:#f5f3ff; --card:#fff; --ink:#1e1b4b; --muted:#6b7280;
  --primary:#4f46e5; --good:#16a34a; --bad:#e11d48; --line:#e5e7eb;
  --l0:#f3f4f6; --l1:#fee2e2; --l2:#fed7aa; --l3:#fef08a; --l4:#bbf7d0; --l5:#4ade80;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;-webkit-user-select:none;user-select:none;overscroll-behavior:none;font:16px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}
#app{max-width:480px;margin:0 auto;padding:16px calc(16px + env(safe-area-inset-left)) calc(16px + env(safe-area-inset-bottom))}
h1{font-size:22px;margin:8px 0 16px}
h2{font-size:17px;margin:20px 0 8px}
.card{background:var(--card);border-radius:16px;padding:16px;margin-bottom:12px;box-shadow:0 1px 3px #0001}
button{font:inherit;font-weight:600;border:none;border-radius:14px;padding:14px;cursor:pointer;color:var(--ink);background:#eef2ff;touch-action:manipulation}
button:active{transform:scale(.97)}
.primary{background:var(--primary);color:#fff}
.ghost{background:transparent;color:var(--muted);font-weight:500;padding:8px}
.grid10{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.grid10 button{padding:16px 0;font-size:18px}
.grid10 button[aria-pressed=true]{background:var(--primary);color:#fff}
.modes{display:grid;gap:8px}
.modes button{text-align:left;padding:16px;display:flex;flex-direction:column;gap:2px}
.modes small{font-weight:400;color:var(--muted);font-size:13px}
.modes button.primary small{color:#e0e7ff}
/* quiz */
.bar{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:14px;margin-bottom:8px}
.q{font-size:44px;font-weight:700;text-align:center;margin:24px 0 8px;letter-spacing:2px}
.teach{background:#eef2ff;border-radius:14px;padding:14px;margin-bottom:12px;text-align:center}
.dots{display:grid;gap:6px;justify-content:center;margin:10px 0}
.dots div{display:grid;gap:6px;grid-auto-flow:column}
.dot{width:14px;height:14px;border-radius:50%;background:var(--primary)}
.answerrow{display:flex;gap:10px;align-items:stretch;margin:8px 0}
.answer{flex:1;background:#fff;border:3px solid var(--line);border-radius:14px;font-size:36px;font-weight:700;
        text-align:center;padding:10px;min-height:66px;display:flex;align-items:center;justify-content:center}
.answer.ok{border-color:var(--good);color:var(--good)}
.answer.no{border-color:var(--bad);color:var(--bad)}
#mic{width:66px;font-size:24px}
#mic.on{background:var(--bad);color:#fff}
.fb{min-height:26px;text-align:center;font-weight:600;margin-bottom:6px}
.fb.ok{color:var(--good)} .fb.no{color:var(--bad)}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.pad button{font-size:26px;padding:18px 0;background:#fff;box-shadow:0 1px 2px #0001}
.pad .go{background:var(--good);color:#fff}
/* progress */
table{border-collapse:collapse;width:100%;font-size:12px;table-layout:fixed}
td,th{text-align:center;padding:4px 0;border-radius:4px;color:var(--muted);font-weight:600}
td.f{color:var(--ink)}
.legend{display:flex;gap:6px;align-items:center;font-size:12px;color:var(--muted);margin-top:10px;flex-wrap:wrap}
.sw{width:16px;height:16px;border-radius:4px;display:inline-block}
.big{font-size:32px;font-weight:700;text-align:center}
</style>
</head>
<body>
<div id="app">

<section id="setup">
  <h1>🎲 Maaltafels oefenen</h1>
  <div class="card">
    <h2 style="margin-top:0">Welke tafels oefen je?</h2>
    <div class="grid10" id="tablepick"></div>
  </div>
  <div class="card modes">
    <button class="primary" data-mode="learn"><span>📚 Nieuwe tafel leren</span><small>Stap voor stap, met uitleg</small></button>
    <button data-mode="practice"><span>🔁 Oefenen</span><small>Slim herhalen wat je nog niet vast kent</small></button>
    <button data-mode="weak"><span>🎯 Moeilijke sommen</span><small>Alleen waar je fouten op maakt</small></button>
    <button data-mode="timed"><span>⏱️ Op tijd</span><small>1 minuut, zo veel mogelijk juist</small></button>
  </div>
  <button class="ghost" style="width:100%" onclick="showProgress()">📊 Mijn vooruitgang</button>
</section>

<section id="learnpick" hidden>
  <h1>Welke tafel wil je leren?</h1>
  <div class="card"><div class="grid10" id="learnpickgrid"></div></div>
  <button class="ghost" style="width:100%" onclick="show('setup')">← Terug</button>
</section>

<section id="quiz" hidden>
  <div class="bar"><span id="counter"></span><button class="ghost" onclick="finish()">Stoppen</button></div>
  <div id="teach" hidden></div>
  <div class="q" id="question"></div>
  <div class="answerrow">
    <div class="answer" id="answer"></div>
    <button id="mic" title="Zeg je antwoord">🎤</button>
  </div>
  <div class="fb" id="fb"></div>
  <div class="pad" id="pad"></div>
</section>

<section id="done" hidden>
  <h1>Klaar! 🎉</h1>
  <div class="card">
    <div class="big" id="score"></div>
    <p id="donetext" style="text-align:center;color:var(--muted)"></p>
  </div>
  <button class="primary" style="width:100%;margin-bottom:8px" id="again">Nog een keer</button>
  <button class="ghost" style="width:100%" onclick="show('setup')">Naar het menu</button>
</section>

<section id="progress" hidden>
  <h1>📊 Mijn vooruitgang</h1>
  <div class="card" id="progcard"></div>
  <button class="ghost" style="width:100%" onclick="show('setup')">← Terug</button>
  <button class="ghost" style="width:100%;color:var(--bad)" onclick="wipe()">Alles wissen</button>
</section>

</div>
<script>
const $ = s => document.querySelector(s);
const DAY = 86400000, today = () => Math.floor(Date.now()/DAY);

// --- leerregels ---------------------------------------------------------
const GAPS = [1,2,4,8,16,32];      // Leitner: hoeveel vragen later komt hij terug
const FAST = 5000;                 // ms: sneller = uit het hoofd, trager = uitgerekend
const MAX_LEARNING = 5;            // hoeveel wankele sommen tegelijk in het hoofd
const INTRO_ORDER = [1,2,10,5,3,4,6,7,8,9];  // van makkelijk naar moeilijk
const ROUND = 20;                  // vragen per ronde
const TIMED_MS = 60000;

// --- opslag -------------------------------------------------------------
function load(){
  let d;
  try { d = JSON.parse(localStorage.getItem('maaltafels')||'null'); } catch(e){ d = null; }
  if(!d || !d.facts) d = {tables:[2,5,10], facts:{}};
  const t = today();
  for(const f of Object.values(d.facts))      // vergeetcurve: te lang niet gezien = zakt een niveau
    if(f.day && t - f.day > 2**f.lvl) f.lvl = Math.max(0, f.lvl-1);
  return d;
}
let S = load();
const save = () => localStorage.setItem('maaltafels', JSON.stringify(S));
const peek = (a,b) => S.facts[a+'x'+b] || {lvl:0,due:0,seen:0,ok:0,err:0,day:0};
function fact(a,b){
  const k = a+'x'+b;
  if(!S.facts[k]){
    const twin = S.facts[b+'x'+a];   // 7x4 kennen helpt bij 4x7
    S.facts[k] = {lvl: twin ? Math.min(2, twin.lvl) : 0, due:0, seen:0, ok:0, err:0, day:0};
  }
  return S.facts[k];
}

// --- schermen -----------------------------------------------------------
function show(id){
  for(const s of document.querySelectorAll('#app > section')) s.hidden = s.id !== id;
}

function drawTablePick(){
  $('#tablepick').innerHTML = '';
  for(let n=1;n<=10;n++){
    const b = document.createElement('button');
    b.textContent = n;
    b.setAttribute('aria-pressed', S.tables.includes(n));
    b.onclick = () => {
      S.tables = S.tables.includes(n) ? S.tables.filter(x=>x!==n) : [...S.tables, n].sort((x,y)=>x-y);
      if(!S.tables.length) S.tables = [n];
      save(); drawTablePick();
if('serviceWorker' in navigator) addEventListener('load', () => navigator.serviceWorker.register('./sw.js'));
    };
    $('#tablepick').append(b);
  }
}
for(const b of document.querySelectorAll('.modes button'))
  b.onclick = () => b.dataset.mode === 'learn' ? show('learnpick') : start(b.dataset.mode);

$('#learnpickgrid').innerHTML = '';
for(let n=1;n<=10;n++){
  const b = document.createElement('button');
  b.textContent = n;
  b.onclick = () => {
    if(!S.tables.includes(n)){ S.tables = [...S.tables, n].sort((x,y)=>x-y); save(); drawTablePick(); }
    start('learn', n);
  };
  $('#learnpickgrid').append(b);
}

// --- sessie -------------------------------------------------------------
let ses = null, buf = '', locked = false, timer = null;

function start(mode, table){
  const tables = mode === 'learn' ? [table] : S.tables;
  let pool = [];
  for(const a of tables) for(let b=1;b<=10;b++) pool.push([a,b]);
  if(mode === 'weak'){
    const hard = pool.filter(([a,b]) => peek(a,b).seen && (peek(a,b).err > 0 || peek(a,b).lvl < 3));
    if(hard.length >= 4) pool = hard;
  }
  if(mode === 'timed'){
    const known = pool.filter(([a,b]) => peek(a,b).seen > 0);
    if(known.length >= 5) pool = known;
  }
  ses = {mode, pool, step:0, right:0, wrong:0, n:0, last:null, cur:null, t0:0,
         endsAt: mode === 'timed' ? Date.now()+TIMED_MS : 0};
  $('#again').onclick = () => start(mode, table);
  show('quiz'); next();
  clearInterval(timer);
  if(mode === 'timed') timer = setInterval(tick, 250);
}

function tick(){
  if(!ses) return;
  const left = Math.max(0, ses.endsAt - Date.now());
  $('#counter').textContent = '⏱️ ' + Math.ceil(left/1000) + 's  ·  ' + ses.right + ' juist';
  if(left === 0) finish();
}

// welke som nu? -> nieuwe som introduceren, anders de meest achterstallige herhaling
function pick(){
  const started = ses.pool.filter(([a,b]) => peek(a,b).seen > 0);
  const fresh   = ses.pool.filter(([a,b]) => peek(a,b).seen === 0);
  const shaky   = started.filter(([a,b]) => peek(a,b).lvl < 3).length;
  const due     = started.filter(([a,b]) => peek(a,b).due <= ses.step);
  const wantNew = ses.mode === 'learn' ? shaky < MAX_LEARNING
                                       : !due.length && shaky < MAX_LEARNING && ses.mode !== 'timed';
  if(fresh.length && (wantNew || !started.length)){
    fresh.sort((x,y) => INTRO_ORDER.indexOf(x[1]) - INTRO_ORDER.indexOf(y[1]));
    return fresh[0];
  }
  const c = (due.length ? due : started).slice().sort((x,y) => peek(...x).due - peek(...y).due);
  if(!c.length) return ses.pool[0];
  const top = c.slice(0, Math.min(3, c.length));
  let n = top[Math.random()*top.length|0];
  if(ses.last && n[0] === ses.last[0] && n[1] === ses.last[1] && c.length > 1) n = c.find(p => p !== n);
  return n;
}

function next(){
  if(!ses) return;
  if(ses.mode !== 'timed' && ses.n >= ROUND) return finish();
  ses.cur = pick(); ses.last = ses.cur;
  const [a,b] = ses.cur, first = peek(a,b).seen === 0;
  buf = ''; locked = false;
  $('#question').textContent = a + ' × ' + b + ' = ?';
  $('#answer').className = 'answer'; $('#answer').textContent = '';
  $('#fb').className = 'fb'; $('#fb').textContent = '';
  $('#teach').hidden = !(first && ses.mode === 'learn');
  if(!$('#teach').hidden) $('#teach').innerHTML = teachCard(a,b);
  if(ses.mode !== 'timed') $('#counter').textContent = (ses.n+1) + ' / ' + ROUND;
  ses.t0 = Date.now();
}

function teachCard(a,b){
  const rows = Array.from({length:a}, () => '<div>' + '<span class="dot"></span>'.repeat(b) + '</div>').join('');
  return '<div class="teach"><b>' + a + ' keer ' + b + '</b><div class="dots">' + rows + '</div>' +
         Array(a).fill(b).join(' + ') + ' = <b>' + a*b + '</b></div>';
}

function answer(){
  if(locked || buf === '') return;
  const [a,b] = ses.cur, f = fact(a,b), ms = Date.now() - ses.t0, good = +buf === a*b;
  f.seen++; ses.step++; ses.n++;
  if(good){
    f.ok++; f.day = today(); ses.right++;
    f.lvl = Math.min(ms < FAST ? 5 : 3, f.lvl + 1);   // pas "gekend" als het vlot gaat
    f.due = ses.step + GAPS[f.lvl];
  } else {
    f.err++; ses.wrong++;
    f.lvl = Math.max(0, f.lvl - 2);
    f.due = ses.step + 2;                              // komt bijna meteen terug
  }
  save();
  $('#answer').className = 'answer ' + (good ? 'ok' : 'no');
  $('#fb').className = 'fb ' + (good ? 'ok' : 'no');
  $('#fb').textContent = good ? ['Goed zo!','Juist!','Top!','Knap!'][Math.random()*4|0]
                              : a + ' × ' + b + ' = ' + a*b;
  locked = true;
  setTimeout(next, good ? 700 : 2200);
}

function finish(){
  clearInterval(timer);
  if(!ses) return;
  const t = ses.right + ses.wrong;
  $('#score').textContent = ses.right + ' / ' + t + ' juist';
  const mastered = Object.values(S.facts).filter(f => f.lvl === 5).length;
  $('#donetext').textContent = t && ses.right/t >= .8
    ? 'Straf gedaan! Je kent al ' + mastered + ' sommen vanbuiten. ⭐'
    : 'Goed geoefend. Je kent al ' + mastered + ' sommen vanbuiten.';
  show('done');
}

// --- invoer: numpad + toetsenbord + spraak ------------------------------
$('#pad').innerHTML = '';
for(const k of [1,2,3,4,5,6,7,8,9,'⌫',0,'✓']){
  const b = document.createElement('button');
  b.textContent = k;
  if(k === '✓') b.className = 'go';
  b.onclick = () => key(k);
  $('#pad').append(b);
}
function key(k){
  if(locked) return;
  if(k === '⌫') buf = buf.slice(0,-1);
  else if(k === '✓') return answer();
  else if(buf.length < 3) buf += k;
  $('#answer').textContent = buf;
}
addEventListener('keydown', e => {
  if($('#quiz').hidden) return;
  if(/^[0-9]$/.test(e.key)) key(+e.key);
  else if(e.key === 'Backspace') key('⌫');
  else if(e.key === 'Enter') key('✓');
});

// Nederlandse getalwoorden -> getal ("vierentwintig" -> 24)
const NL = {nul:0,een:1,twee:2,drie:3,vier:4,vijf:5,zes:6,zeven:7,acht:8,negen:9,tien:10,elf:11,
  twaalf:12,dertien:13,veertien:14,vijftien:15,zestien:16,zeventien:17,achttien:18,negentien:19,
  twintig:20,dertig:30,veertig:40,vijftig:50,zestig:60,zeventig:70,tachtig:80,negentig:90,honderd:100};
function parseNL(text){
  const s = text.toLowerCase().normalize('NFD').replace(/[^a-z0-9]/g,'');
  const d = s.match(/\d+/g);
  if(d) return +d[d.length-1];
  if(s in NL) return NL[s];
  const m = s.match(/^(.+?)en(twintig|dertig|veertig|vijftig|zestig|zeventig|tachtig|negentig)$/);
  if(m && m[1] in NL) return NL[m[1]] + NL[m[2]];
  return null;
}
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
if(!SR) $('#mic').hidden = true;
else {
  const rec = new SR();
  rec.lang = 'nl-BE'; rec.interimResults = false; rec.maxAlternatives = 3;
  let on = false;
  $('#mic').onclick = () => { on ? rec.stop() : rec.start(); };
  rec.onstart = () => { on = true; $('#mic').classList.add('on'); };
  rec.onend   = () => { on = false; $('#mic').classList.remove('on'); };
  rec.onerror = () => { $('#fb').textContent = 'Ik heb je niet gehoord'; };
  rec.onresult = e => {
    for(const alt of e.results[0]){
      const n = parseNL(alt.transcript);
      if(n !== null){ buf = String(n); $('#answer').textContent = buf; return answer(); }
    }
    $('#fb').textContent = 'Zeg enkel het getal';
  };
}

// --- vooruitgang --------------------------------------------------------
function showProgress(){
  let h = '<table><tr><th></th>';
  for(let b=1;b<=10;b++) h += '<th>' + b + '</th>';
  h += '</tr>';
  for(let a=1;a<=10;a++){
    h += '<tr><th>' + a + '</th>';
    for(let b=1;b<=10;b++){
      const f = peek(a,b);
      h += '<td class="' + (f.seen?'f':'') + '" style="background:var(--l' + f.lvl + ')">' + (f.seen ? a*b : '·') + '</td>';
    }
    h += '</tr>';
  }
  h += '</table><div class="legend">Nog niet gezien';
  for(let i=0;i<=5;i++) h += '<span class="sw" style="background:var(--l' + i + ')"></span>';
  h += 'Vanbuiten gekend</div>';
  const m = Object.values(S.facts).filter(f => f.lvl === 5).length;
  h += '<p style="text-align:center;margin:14px 0 0"><b>' + m + '</b> van de 100 sommen ken je vanbuiten ⭐</p>';
  $('#progcard').innerHTML = h;
  show('progress');
}
function wipe(){
  if(!confirm('Alle vooruitgang wissen?')) return;
  S = {tables:[2,5,10], facts:{}}; save(); drawTablePick(); show('setup');
}

drawTablePick();

// --- zelftest: open index.html#test -------------------------------------
if(location.hash === '#test'){
  const eq = (got, want, msg) => { if(JSON.stringify(got) !== JSON.stringify(want))
    throw new Error(msg + ': ' + JSON.stringify(got) + ' ≠ ' + JSON.stringify(want)); };
  // getalwoorden
  eq(parseNL('twaalf'), 12, 'twaalf');
  eq(parseNL('vierentwintig'), 24, 'vierentwintig');
  eq(parseNL('drieëntwintig'), 23, 'drieentwintig');
  eq(parseNL('negenentachtig'), 89, 'negenentachtig');
  eq(parseNL('honderd'), 100, 'honderd');
  eq(parseNL('dat is 42'), 42, 'cijfers');
  eq(parseNL('bwaah'), null, 'onzin');
  // planning
  S = {tables:[3], facts:{}};
  ses = {mode:'learn', pool:[[3,1],[3,2],[3,7]], step:0, right:0, wrong:0, n:0, last:null, cur:null, t0:0, endsAt:0};
  eq(pick(), [3,1], 'makkelijkste som eerst');
  ses.cur = [3,7]; ses.t0 = Date.now(); buf = '21'; locked = false; answer();
  eq(S.facts['3x7'].lvl, 1, 'juist+snel = niveau omhoog');
  eq(S.facts['3x7'].due, ses.step + GAPS[1], 'volgende herhaling ingepland');
  ses.cur = [3,7]; ses.t0 = Date.now(); buf = '20'; locked = false; answer();
  eq(S.facts['3x7'].lvl, 0, 'fout = niveau omlaag');
  eq(S.facts['3x7'].due, ses.step + 2, 'fout = bijna meteen terug');
  ses.cur = [3,7]; ses.t0 = Date.now() - 9000; buf = '21'; locked = false; answer();
  eq(S.facts['3x7'].lvl, 1, 'traag juist telt, maar nooit hoger dan 3');
  ses = null;
  document.body.innerHTML = '<h1 style="padding:20px">✅ Alle tests OK</h1>';
  localStorage.removeItem('maaltafels');
}
</script>
</body>
</html>
